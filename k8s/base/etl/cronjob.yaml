apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-etl
  labels:
    app.kubernetes.io/name: github-etl
    app.kubernetes.io/component: etl
spec:
  schedule: "0 * * * *"          # once per hour, at minute 0
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid      # never two runs at the same time
  startingDeadlineSeconds: 600   # skip a run that could not start within 10 min
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: github-etl
            app.kubernetes.io/component: etl
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: etl
              image: etl
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: { name: etl-config }
              env:
                - name: DB_NAME
                  valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME } }
                - name: MONGODB_URI
                  valueFrom: { secretKeyRef: { name: mongo-app, key: MONGODB_URI } }
                - name: GITHUB_TOKEN
                  valueFrom: { secretKeyRef: { name: github-token, key: GITHUB_TOKEN, optional: true } }
                - name: ALERT_WEBHOOK_URL
                  valueFrom: { secretKeyRef: { name: alerting, key: ALERT_WEBHOOK_URL, optional: true } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
