# Local environment: Docker Desktop Kubernetes / kind / k3d.
# Images are built locally (tag :local) and never pulled from a registry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - name: backend
    newName: devops-case/backend
    newTag: local
  - name: frontend
    newName: devops-case/frontend
    newTag: local
  - name: etl
    newName: devops-case/etl
    newTag: local

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 1

patches:
  - target: { kind: Deployment }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: { kind: CronJob, name: github-etl }
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: Never
