# Alert rules for the critical events of this system.
# kube_* metrics come from kube-state-metrics (part of kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-case-alerts
  labels:
    release: monitoring
spec:
  groups:
    - name: availability
      rules:
        - alert: BackendNoReadyPods
          expr: kube_deployment_status_replicas_available{namespace="mern",deployment="backend"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "No ready backend pods - the API is down"
            runbook: "kubectl -n mern describe deploy backend; kubectl -n mern logs -l app.kubernetes.io/name=backend --tail=100; check MongoDB readiness"
        - alert: MongoNotReady
          expr: kube_statefulset_status_replicas_ready{namespace="mern",statefulset="mongo"} < 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "MongoDB pod is not ready - backend readiness will fail"
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="mern"}[15m]) > 3
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} restarted more than 3 times in 15 minutes"
        - alert: BackendHigh5xxRate
          expr: |
            sum(rate(http_requests_total{namespace="mern",status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="mern"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "More than 5% of API requests fail with 5xx"
        - alert: BackendHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="mern"}[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "API p95 latency above 1s"
    - name: batch-jobs
      rules:
        - alert: GithubEtlJobFailed
          expr: kube_job_status_failed{namespace="mern",job_name=~"github-etl-.*"} > 0
          labels: { severity: warning }
          annotations:
            summary: "ETL job {{ $labels.job_name }} failed"
            runbook: "kubectl -n mern logs job/{{ $labels.job_name }}"
        - alert: GithubEtlNotRunRecently
          expr: time() - kube_cronjob_status_last_successful_time{namespace="mern",cronjob="github-etl"} > 3 * 3600
          labels: { severity: warning }
          annotations:
            summary: "ETL has not succeeded for more than 3 hours"
        - alert: MongoBackupJobFailed
          expr: kube_job_status_failed{namespace="mern",job_name=~"mongo-backup-.*"} > 0
          labels: { severity: critical }
          annotations:
            summary: "MongoDB backup job {{ $labels.job_name }} failed"
        - alert: MongoBackupTooOld
          expr: time() - kube_cronjob_status_last_successful_time{namespace="mern",cronjob="mongo-backup"} > 13 * 3600
          labels: { severity: critical }
          annotations:
            summary: "No successful MongoDB backup in 13h (RPO target 6h is violated)"
    - name: capacity
      rules:
        - alert: PersistentVolumeAlmostFull
          expr: |
            kubelet_volume_stats_available_bytes{namespace="mern"} / kubelet_volume_stats_capacity_bytes{namespace="mern"} < 0.15
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} has less than 15% free space"
